name: Compilar para Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Configurar o projeto
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Obter o runtime NDI validado na versão 0.3.1
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ProgressPreference = "SilentlyContinue"
          $packagePath = "$env:RUNNER_TEMP\zosma-v0.3.1.zip"
          $ndiRuntimeDir = "$env:RUNNER_TEMP\ndi-runtime"
          Invoke-WebRequest `
            -Uri "https://github.com/1bytelabs/1bytelabs-transmitter/releases/download/v0.3.1-beta/Zosma-Transmitter-v0.3.1-beta-Windows-x64.zip" `
            -OutFile $packagePath
          Expand-Archive -Path $packagePath -DestinationPath $ndiRuntimeDir -Force

      - name: Preparar somente o driver de vídeo virtual assinado
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ProgressPreference = "SilentlyContinue"
          $vddZip = "$env:RUNNER_TEMP\vdd-control.zip"
          $vddDir = "$env:RUNNER_TEMP\vdd-control"
          Invoke-WebRequest -Uri "https://github.com/VirtualDrivers/Virtual-Display-Driver/releases/download/25.7.23/VDD.Control.25.7.23.zip" -OutFile $vddZip
          $expected = "a701f2272e9fcf382849b24f913c6dd07597b3b1116525f2e90182f019609154"
          if ((Get-FileHash $vddZip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw "O pacote do VDD não corresponde à versão fixada."
          }
          Expand-Archive -Path $vddZip -DestinationPath $vddDir -Force
          $drivers = @(Get-ChildItem $vddDir -Filter "MttVDD.inf" -File -Recurse |
            Where-Object { (Get-Content $_.FullName -Raw) -match '(?i)\.NTamd64' })
          if ($drivers.Count -ne 1) {
            throw "Driver MttVDD x64 ausente ou ambíguo. INFs: $((Get-ChildItem $vddDir -Filter *.inf -Recurse).FullName -join ', ')"
          }
          $driverDir = $drivers[0].DirectoryName
          $cat = Join-Path $driverDir "MttVDD.cat"
          if ((Get-AuthenticodeSignature $cat).Status -ne "Valid") {
            throw "Assinatura do catálogo do driver inválida."
          }
          $out = New-Item -ItemType Directory -Force -Path "dist-transmitter\virtual-display"
          foreach ($file in @("MttVDD.inf", "MttVDD.cat", "MttVDD.dll")) {
            Copy-Item -LiteralPath (Join-Path $driverDir $file) -Destination $out.FullName
          }
          Copy-Item "third_party\virtual-display\LICENSE.txt" (Join-Path $out.FullName "LICENSE-VIRTUAL-DISPLAY.txt")

      - name: Montar pacotes portáteis
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-transmitter | Out-Null
          New-Item -ItemType Directory -Force -Path dist-receiver | Out-Null

          Copy-Item `
            "build\Release\1Byte Labs Transmitter.exe" `
            "dist-transmitter\1Byte Labs Transmitter.exe"

          Copy-Item `
            "build\Release\1Byte Labs Receiver.exe" `
            "dist-receiver\1Byte Labs Receiver.exe"

          $ndiDll = Get-ChildItem `
            -Path "$env:RUNNER_TEMP\ndi-runtime" `
            -Filter "Processing.NDI.Lib.x64.dll" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $ndiDll) {
            throw "A DLL redistribuível do NDI não foi localizada."
          }

          Copy-Item `
            $ndiDll.FullName `
            "dist-transmitter\Processing.NDI.Lib.x64.dll"

          Copy-Item `
            $ndiDll.FullName `
            "dist-receiver\Processing.NDI.Lib.x64.dll"

          Copy-Item "TELA-VIRTUAL.md" "dist-transmitter\TELA-VIRTUAL.md"
          Copy-Item "README-TESTE.txt" "dist-transmitter\LEIA-ME.txt"
          Copy-Item "README-RECEIVER-TESTE.txt" "dist-receiver\LEIA-ME.txt"
          Copy-Item "THIRD_PARTY_NOTICES.md" "dist-transmitter\AVISOS-DE-TERCEIROS.txt"
          Copy-Item "THIRD_PARTY_NOTICES.md" "dist-receiver\AVISOS-DE-TERCEIROS.txt"

      - name: Compilar instalador do Transmitter
        shell: pwsh
        run: |
          $version = [regex]::Match((Get-Content CMakeLists.txt -Raw), 'project\(OneByteLabsTransmitter VERSION (\d+\.\d+\.\d+)').Groups[1].Value
          if (-not $version) { throw "Versão do Transmitter não localizada." }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup 6 não encontrado na imagem Windows." }
          & $iscc "/DTransmitterVersion=$version" installer\transmitter.iss
          if ($LASTEXITCODE -ne 0) { throw "Falha ao compilar o instalador." }

      - name: Testar instalação e remoção do aplicativo sem driver
        timeout-minutes: 5
        shell: pwsh
        run: |
          $testDir = Join-Path $env:RUNNER_TEMP "transmitter-install-test"
          $setup = "dist-installer\1ByteLabs-Transmitter-Setup-Windows-x64.exe"
          $result = Start-Process $setup -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$testDir`"" -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Falha na instalação: $($result.ExitCode)" }
          foreach ($file in @("1Byte Labs Transmitter.exe", "Processing.NDI.Lib.x64.dll", "virtual-display\MttVDD.inf", "virtual-display\MttVDD.cat", "virtual-display\MttVDD.dll", "virtual-display\LICENSE-VIRTUAL-DISPLAY.txt")) {
            if (-not (Test-Path (Join-Path $testDir $file))) { throw "Arquivo não instalado: $file" }
          }
          $uninstall = @(Get-ChildItem $testDir -Filter "unins*.exe")
          if ($uninstall.Count -ne 1) { throw "Desinstalador ausente ou ambíguo." }
          $result = Start-Process $uninstall[0].FullName -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait -PassThru
          if ($result.ExitCode -ne 0 -or (Test-Path (Join-Path $testDir "1Byte Labs Transmitter.exe"))) {
            throw "Falha na desinstalação: $($result.ExitCode)"
          }

      - name: Publicar instalador de teste do Transmitter
        uses: actions/upload-artifact@v4
        with:
          name: 1ByteLabs-Transmitter-Setup-Windows-x64
          path: dist-installer/1ByteLabs-Transmitter-Setup-Windows-x64.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publicar artifact de teste
        uses: actions/upload-artifact@v4
        with:
          name: 1ByteLabs-Transmitter-Windows-x64
          path: dist-transmitter/*
          if-no-files-found: error
          retention-days: 30

      - name: Publicar artifact de teste do Receiver
        uses: actions/upload-artifact@v4
        with:
          name: 1ByteLabs-Receiver-Windows-x64
          path: dist-receiver/*
          if-no-files-found: error
          retention-days: 30

      - name: Compactar pacotes da release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release v0.5.0-beta'))
        shell: pwsh
        env:
          BUILD_REF: ${{ github.ref }}
          BUILD_REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = if ($env:BUILD_REF.StartsWith("refs/tags/")) { $env:BUILD_REF_NAME } else { "v0.5.0-beta" }
          Compress-Archive -Path "dist-transmitter\*" -DestinationPath "1ByteLabs-Transmitter-$tag-Windows-x64.zip" -Force
          Compress-Archive -Path "dist-receiver\*" -DestinationPath "1ByteLabs-Receiver-$tag-Windows-x64.zip" -Force
          Copy-Item "dist-installer\1ByteLabs-Transmitter-Setup-Windows-x64.exe" "1ByteLabs-Transmitter-$tag-Setup-Windows-x64.exe"

      - name: Publicar 0.5.0 Beta
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release v0.5.0-beta')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.5.0-beta"
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" 2>$null
          if ($LASTEXITCODE -eq 0) { exit 0 }
          gh release create $tag `
            "1ByteLabs-Transmitter-$tag-Setup-Windows-x64.exe" `
            "1ByteLabs-Transmitter-$tag-Windows-x64.zip" `
            "1ByteLabs-Receiver-$tag-Windows-x64.zip" `
            --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" `
            --title "1Byte Labs Transmitter 0.5.0 Beta" `
            --notes-file "docs/releases/$tag.md" --latest
          exit $LASTEXITCODE

      - name: Anexar pacotes à release por tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          for ($attempt = 1; $attempt -le 12; $attempt++) {
            gh release view $tag --repo "$env:GITHUB_REPOSITORY" 2>$null
            if ($LASTEXITCODE -eq 0) {
              gh release upload $tag `
                "1ByteLabs-Transmitter-$tag-Setup-Windows-x64.exe" `
                "1ByteLabs-Transmitter-$tag-Windows-x64.zip" `
                "1ByteLabs-Receiver-$tag-Windows-x64.zip" `
                --repo "$env:GITHUB_REPOSITORY" --clobber
              exit $LASTEXITCODE
            }
            Start-Sleep -Seconds 5
          }
          throw "A release $tag não ficou disponível a tempo para receber o pacote."
