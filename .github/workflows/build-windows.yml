name: Compilar para Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Configurar o projeto
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Obter o runtime NDI validado na versão 0.3.1
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ProgressPreference = "SilentlyContinue"
          $packagePath = "$env:RUNNER_TEMP\zosma-v0.3.1.zip"
          $ndiRuntimeDir = "$env:RUNNER_TEMP\ndi-runtime"
          Invoke-WebRequest `
            -Uri "https://github.com/1bytelabs/1bytelabs-transmitter/releases/download/v0.3.1-beta/Zosma-Transmitter-v0.3.1-beta-Windows-x64.zip" `
            -OutFile $packagePath
          Expand-Archive -Path $packagePath -DestinationPath $ndiRuntimeDir -Force

      - name: Preparar Virtual Driver Control original
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ProgressPreference = "SilentlyContinue"
          $vddZip = "$env:RUNNER_TEMP\vdd-control.zip"
          $vddDir = "$env:RUNNER_TEMP\vdd-control"
          Invoke-WebRequest -Uri "https://github.com/VirtualDrivers/Virtual-Display-Driver/releases/download/25.7.23/VDD.Control.25.7.23.zip" -OutFile $vddZip
          $expected = "a701f2272e9fcf382849b24f913c6dd07597b3b1116525f2e90182f019609154"
          if ((Get-FileHash $vddZip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw "O pacote do VDD não corresponde à versão fixada."
          }
          Expand-Archive -Path $vddZip -DestinationPath $vddDir -Force
          $control = @(Get-ChildItem $vddDir -Filter "VDD Control.exe" -Recurse)
          if ($control.Count -ne 1) { throw "VDD Control.exe ausente ou ambíguo." }
          $signature = Get-AuthenticodeSignature $control[0].FullName
          if ($signature.Status -ne "Valid") { throw "Assinatura do VDD Control inválida: $($signature.Status)" }
          $catalogs = @(Get-ChildItem $control[0].DirectoryName -Filter *.cat -Recurse)
          if ($catalogs.Count -eq 0) { throw "Catálogos dos drivers ausentes." }
          foreach ($catalog in $catalogs) {
            if ((Get-AuthenticodeSignature $catalog.FullName).Status -ne "Valid") {
              throw "Assinatura inválida: $($catalog.Name)"
            }
          }
          New-Item -ItemType Directory -Force -Path "dist-transmitter\virtual-display" | Out-Null
          Copy-Item "$($control[0].DirectoryName)\*" "dist-transmitter\virtual-display" -Recurse -Force
          Copy-Item "third_party\virtual-display\LICENSE.txt" "dist-transmitter\virtual-display\LICENSE-VIRTUAL-DISPLAY.txt"

      - name: Montar pacotes portáteis
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-transmitter | Out-Null
          New-Item -ItemType Directory -Force -Path dist-receiver | Out-Null

          Copy-Item `
            "build\Release\1Byte Labs Transmitter.exe" `
            "dist-transmitter\1Byte Labs Transmitter.exe"

          Copy-Item `
            "build\Release\1Byte Labs Receiver.exe" `
            "dist-receiver\1Byte Labs Receiver.exe"

          $ndiDll = Get-ChildItem `
            -Path "$env:RUNNER_TEMP\ndi-runtime" `
            -Filter "Processing.NDI.Lib.x64.dll" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $ndiDll) {
            throw "A DLL redistribuível do NDI não foi localizada."
          }

          Copy-Item `
            $ndiDll.FullName `
            "dist-transmitter\Processing.NDI.Lib.x64.dll"

          Copy-Item `
            $ndiDll.FullName `
            "dist-receiver\Processing.NDI.Lib.x64.dll"

          Copy-Item "TELA-VIRTUAL.md" "dist-transmitter\TELA-VIRTUAL.md"
          Copy-Item "README-TESTE.txt" "dist-transmitter\LEIA-ME.txt"
          Copy-Item "README-RECEIVER-TESTE.txt" "dist-receiver\LEIA-ME.txt"
          Copy-Item "THIRD_PARTY_NOTICES.md" "dist-transmitter\AVISOS-DE-TERCEIROS.txt"
          Copy-Item "THIRD_PARTY_NOTICES.md" "dist-receiver\AVISOS-DE-TERCEIROS.txt"

      - name: Publicar artifact de teste
        uses: actions/upload-artifact@v4
        with:
          name: 1ByteLabs-Transmitter-Windows-x64
          path: dist-transmitter/*
          if-no-files-found: error
          retention-days: 30

      - name: Publicar artifact de teste do Receiver
        uses: actions/upload-artifact@v4
        with:
          name: 1ByteLabs-Receiver-Windows-x64
          path: dist-receiver/*
          if-no-files-found: error
          retention-days: 30

      - name: Compactar pacote da release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist-transmitter\*" `
            -DestinationPath "1ByteLabs-Transmitter-${{ github.ref_name }}-Windows-x64.zip" `
            -Force

          Compress-Archive `
            -Path "dist-receiver\*" `
            -DestinationPath "1ByteLabs-Receiver-${{ github.ref_name }}-Windows-x64.zip" `
            -Force

      - name: Anexar pacote à release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $transmitterAsset = "1ByteLabs-Transmitter-$tag-Windows-x64.zip"
          $receiverAsset = "1ByteLabs-Receiver-$tag-Windows-x64.zip"

          for ($attempt = 1; $attempt -le 12; $attempt++) {
            gh release view $tag --repo "${{ github.repository }}" 2>$null
            if ($LASTEXITCODE -eq 0) {
              gh release upload $tag $transmitterAsset $receiverAsset `
                --repo "${{ github.repository }}" `
                --clobber
              exit $LASTEXITCODE
            }
            Start-Sleep -Seconds 5
          }

          throw "A release $tag não ficou disponível a tempo para receber o pacote."
