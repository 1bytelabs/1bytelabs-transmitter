name: Renomear ZIPs portable da 0.5.0 Beta

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rename-portable-050.yml

permissions:
  contents: write

jobs:
  rename-assets:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Renomear arquivos existentes e atualizar as notas
        shell: bash
        run: |
          set -euo pipefail
          tag=v0.5.0-beta
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")
          release_id=$(jq -er '.id' <<<"$release")
          for product in Transmitter Receiver; do
            old="1ByteLabs-$product-$tag-Windows-x64.zip"
            new="1ByteLabs-$product-$tag-Portable-Windows-x64.zip"
            id=$(jq -r --arg old "$old" '.assets[] | select(.name == $old) | .id' <<<"$release")
            renamed=$(jq -r --arg new "$new" '.assets[] | select(.name == $new) | .id' <<<"$release")
            if [[ -n "$id" && -z "$renamed" ]]; then
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$id" -f name="$new" --jq .name
            elif [[ -z "$id" && -n "$renamed" ]]; then
              printf '%s já está renomeado\n' "$new"
            else
              printf 'Arquivos inesperados para %s\n' "$product" >&2
              exit 1
            fi
          done
          jq '{body: (.body |
            split("1ByteLabs-Transmitter-v0.5.0-beta-Windows-x64.zip") | join("1ByteLabs-Transmitter-v0.5.0-beta-Portable-Windows-x64.zip") |
            split("1ByteLabs-Receiver-v0.5.0-beta-Windows-x64.zip") | join("1ByteLabs-Receiver-v0.5.0-beta-Portable-Windows-x64.zip"))}' <<<"$release" |
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" --input - --jq .html_url
